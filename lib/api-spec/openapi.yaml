openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ggs-public
    description: Public GGS Hair Studio content and booking
  - name: ggs-admin
    description: GGS CMS administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ggs/site:
    get:
      operationId: getGgsSite
      tags: [ggs-public]
      summary: Get public GGS website content
      responses:
        "200":
          description: Public site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsSiteContent"
  /ggs/services:
    get:
      operationId: getGgsPublicServices
      tags: [ggs-public]
      summary: List active GGS services
      responses:
        "200":
          description: Active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsService"
  /ggs/appointments:
    post:
      operationId: createGgsAppointment
      tags: [ggs-public]
      summary: Request an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAppointmentInput"
      responses:
        "201":
          description: Appointment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAppointment"
        "400":
          description: Invalid request
  /ggs/admin/summary:
    get:
      operationId: getGgsAdminSummary
      tags: [ggs-admin]
      summary: Get GGS CMS dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAdminSummary"
  /ggs/admin/site:
    patch:
      operationId: updateGgsSite
      tags: [ggs-admin]
      summary: Update public GGS website content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsSiteUpdate"
      responses:
        "200":
          description: Updated public site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsSiteContent"
  /ggs/admin/services:
    get:
      operationId: getGgsAdminServices
      tags: [ggs-admin]
      summary: List all services in GGS CMS
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsService"
    post:
      operationId: createGgsService
      tags: [ggs-admin]
      summary: Create a GGS service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsService"
  /ggs/admin/services/{id}:
    patch:
      operationId: updateGgsService
      tags: [ggs-admin]
      summary: Update a GGS service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsServiceInput"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsService"
        "404":
          description: Service not found
    delete:
      operationId: deleteGgsService
      tags: [ggs-admin]
      summary: Delete a GGS service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Service deleted
        "404":
          description: Service not found
  /ggs/admin/appointments:
    get:
      operationId: getGgsAdminAppointments
      tags: [ggs-admin]
      summary: List GGS appointment requests
      responses:
        "200":
          description: Appointment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsAppointment"
  /ggs/admin/appointments/{id}:
    patch:
      operationId: updateGgsAppointment
      tags: [ggs-admin]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAppointmentStatusUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAppointment"
        "404":
          description: Appointment not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GgsSiteContent:
      type: object
      properties:
        brandName:
          type: string
        tagline:
          type: string
        introduction:
          type: string
        phone:
          type: string
        address:
          type: string
        openingHours:
          type: string
        instagramHandle:
          type: string
        heroImageUrl:
          type: ["string", "null"]
      required:
        - brandName
        - tagline
        - introduction
        - phone
        - address
        - openingHours
        - instagramHandle
        - heroImageUrl
    GgsSiteUpdate:
      type: object
      properties:
        brandName:
          type: string
          minLength: 1
          maxLength: 80
        tagline:
          type: string
          maxLength: 180
        introduction:
          type: string
          maxLength: 1200
        phone:
          type: string
          maxLength: 40
        address:
          type: string
          maxLength: 240
        openingHours:
          type: string
          maxLength: 180
        instagramHandle:
          type: string
          maxLength: 80
        heroImageUrl:
          type: ["string", "null"]
          format: uri
    GgsService:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        price:
          type: integer
        active:
          type: boolean
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - category
        - description
        - durationMinutes
        - price
        - active
        - imageUrl
    GgsServiceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 600
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 480
        price:
          type: integer
          minimum: 0
        active:
          type: boolean
        imageUrl:
          type: ["string", "null"]
          format: uri
      required:
        - name
        - category
        - description
        - durationMinutes
        - price
        - active
        - imageUrl
    GgsAppointmentInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 40
        serviceId:
          type: integer
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        notes:
          type: string
          maxLength: 600
      required:
        - customerName
        - email
        - phone
        - serviceId
        - appointmentDate
        - appointmentTime
        - notes
    GgsAppointment:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        serviceId:
          type: integer
        serviceName:
          type: string
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerName
        - email
        - phone
        - serviceId
        - serviceName
        - appointmentDate
        - appointmentTime
        - notes
        - status
        - createdAt
    GgsAppointmentStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
      required:
        - status
    GgsAdminSummary:
      type: object
      properties:
        totalAppointments:
          type: integer
        pendingAppointments:
          type: integer
        confirmedAppointments:
          type: integer
        activeServices:
          type: integer
        monthlyRevenue:
          type: integer
      required:
        - totalAppointments
        - pendingAppointments
        - confirmedAppointments
        - activeServices
        - monthlyRevenue

