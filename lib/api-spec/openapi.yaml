openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ggs-public
    description: Public GGS Hair Studio content and booking
  - name: ggs-admin
    description: GGS CMS administration
  - name: ggs-account
    description: GGS customer account access
  - name: ggs-employee
    description: GGS employee account access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ggs/site:
    get:
      operationId: getGgsSite
      tags: [ggs-public]
      summary: Get public GGS website content
      responses:
        "200":
          description: Public site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsSiteContent"
  /ggs/services:
    get:
      operationId: getGgsPublicServices
      tags: [ggs-public]
      summary: List active GGS services
      responses:
        "200":
          description: Active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsService"
  /ggs/products:
    get:
      operationId: getGgsPublicProducts
      tags: [ggs-public]
      summary: List active GGS retail products
      responses:
        "200":
          description: Active products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsProduct"
  /ggs/vouchers:
    get:
      operationId: getGgsPublicVouchers
      tags: [ggs-public]
      summary: List currently valid GGS vouchers
      responses:
        "200":
          description: Active vouchers that are within their validity dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsPublicVoucher"
  /ggs/appointments:
    post:
      operationId: createGgsAppointment
      tags: [ggs-public]
      summary: Request an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAppointmentInput"
      responses:
        "201":
          description: Appointment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAppointment"
        "400":
          description: Invalid request
  /ggs/account/register:
    post:
      operationId: registerGgsAccount
      tags: [ggs-account]
      summary: Create a GGS customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAccountRegistrationInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAccount"
        "400":
          description: Invalid registration details
        "409":
          description: Email or WhatsApp number is already in use
        "429":
          description: Too many account attempts
  /ggs/account/login:
    post:
      operationId: loginGgsAccount
      tags: [ggs-account]
      summary: Sign in to a GGS customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAccountLoginInput"
      responses:
        "200":
          description: Signed-in customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAccount"
        "400":
          description: Invalid sign-in details
        "401":
          description: Identifier or password is incorrect
        "429":
          description: Too many account attempts
  /ggs/account/session:
    get:
      operationId: getGgsAccountSession
      tags: [ggs-account]
      summary: Get the currently signed-in customer account
      responses:
        "200":
          description: Signed-in customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAccount"
        "401":
          description: No active customer session
  /ggs/account/logout:
    post:
      operationId: logoutGgsAccount
      tags: [ggs-account]
      summary: Sign out of the current customer account
      responses:
        "204":
          description: Signed out
  /ggs/employee/login:
    post:
      operationId: loginGgsEmployee
      tags: [ggs-employee]
      summary: Sign in to an employee account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeLoginInput"
      responses:
        "200":
          description: Signed-in employee account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAccount"
        "400":
          description: Invalid employee ID or password format
        "401":
          description: Employee ID or password is incorrect
        "429":
          description: Too many sign-in attempts
  /ggs/employee/session:
    get:
      operationId: getGgsEmployeeSession
      tags: [ggs-employee]
      summary: Get the currently signed-in employee account
      responses:
        "200":
          description: Signed-in employee account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAccount"
        "401":
          description: No active employee session
  /ggs/employee/logout:
    post:
      operationId: logoutGgsEmployee
      tags: [ggs-employee]
      summary: Sign out of the current employee account
      responses:
        "204":
          description: Signed out
  /ggs/employee/cashier/session:
    get:
      operationId: getGgsEmployeeCashierSession
      tags: [ggs-employee]
      summary: Get the signed-in employee's cashier access
      responses:
        "200":
          description: Cashier access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeCashierSession"
        "401":
          description: No active employee session
  /ggs/employee/cashier/access:
    post:
      operationId: unlockGgsEmployeeCashier
      tags: [ggs-employee]
      summary: Unlock one cashier register with its password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeCashierAccessInput"
      responses:
        "200":
          description: Cashier register unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeCashierAccess"
        "400":
          description: Invalid cashier access request
        "401":
          description: No active employee session
        "403":
          description: Cashier password is incorrect
        "429":
          description: Too many password attempts
        "503":
          description: Cashier password is not configured
  /ggs/employee/cashier/logout:
    post:
      operationId: logoutGgsEmployeeCashier
      tags: [ggs-employee]
      summary: Lock the currently unlocked cashier register
      responses:
        "204":
          description: Cashier register locked
  /ggs/employee/bookings:
    get:
      operationId: getGgsEmployeeBookings
      tags: [ggs-employee]
      summary: List bookings visible to a signed-in employee
      responses:
        "200":
          description: Employee booking schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsEmployeeBooking"
        "401":
          description: No active employee session
  /ggs/employee/attendance/today:
    get:
      operationId: getGgsEmployeeAttendanceToday
      tags: [ggs-employee]
      summary: Get the signed-in employee's attendance status for today
      responses:
        "200":
          description: Attendance status for the current Jakarta date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAttendanceStatus"
        "401":
          description: No active employee session
  /ggs/employee/attendance/history:
    get:
      operationId: getGgsEmployeeAttendanceHistory
      tags: [ggs-employee]
      summary: Get the signed-in employee's recent attendance history
      responses:
        "200":
          description: The five most recent completed or in-progress attendance days before today
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsEmployeeAttendanceStatus"
        "401":
          description: No active employee session
  /ggs/employee/attendance/qr:
    post:
      operationId: createGgsEmployeeAttendanceChallenge
      tags: [ggs-employee]
      summary: Issue a short-lived QR challenge from inside the salon geofence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeAttendanceLocationInput"
      responses:
        "201":
          description: Short-lived attendance QR challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAttendanceChallenge"
        "400":
          description: Invalid location reading
        "401":
          description: No active employee session
        "403":
          description: QR display device is outside the salon geofence
  /ggs/employee/attendance/check-in:
    post:
      operationId: checkInGgsEmployeeAttendance
      tags: [ggs-employee]
      summary: Record the signed-in employee's check-in for today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeAttendanceActionInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAttendanceStatus"
        "401":
          description: No active employee session
        "403":
          description: Employee location is outside the salon geofence or too inaccurate
        "409":
          description: QR challenge is invalid, expired, or already used, or the employee already checked in
  /ggs/employee/attendance/check-out:
    post:
      operationId: checkOutGgsEmployeeAttendance
      tags: [ggs-employee]
      summary: Record the signed-in employee's check-out for today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeAttendanceActionInput"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAttendanceStatus"
        "401":
          description: No active employee session
        "403":
          description: Employee location is outside the salon geofence or too inaccurate
        "409":
          description: QR challenge is invalid, expired, or already used, or the employee must check in first
  /ggs/admin/employees:
    get:
      operationId: getGgsAdminEmployees
      tags: [ggs-admin]
      summary: List GGS employee accounts
      responses:
        "200":
          description: Employee accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsEmployeeAccount"
    post:
      operationId: createGgsAdminEmployee
      tags: [ggs-admin]
      summary: Create an employee account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeAccountInput"
      responses:
        "201":
          description: Employee account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAccount"
        "400":
          description: Invalid employee account details
        "409":
          description: Employee ID is already in use
  /ggs/admin/employees/{id}:
    patch:
      operationId: updateGgsAdminEmployee
      tags: [ggs-admin]
      summary: Update or deactivate an employee account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsEmployeeAccountUpdate"
      responses:
        "200":
          description: Employee account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsEmployeeAccount"
        "400":
          description: Invalid employee account details
        "404":
          description: Employee account not found
        "409":
          description: Employee ID is already in use
  /ggs/admin/summary:
    get:
      operationId: getGgsAdminSummary
      tags: [ggs-admin]
      summary: Get GGS CMS dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAdminSummary"
  /ggs/admin/site:
    patch:
      operationId: updateGgsSite
      tags: [ggs-admin]
      summary: Update public GGS website content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsSiteUpdate"
      responses:
        "200":
          description: Updated public site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsSiteContent"
  /ggs/admin/services:
    get:
      operationId: getGgsAdminServices
      tags: [ggs-admin]
      summary: List all services in GGS CMS
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsService"
    post:
      operationId: createGgsService
      tags: [ggs-admin]
      summary: Create a GGS service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsService"
  /ggs/admin/services/{id}:
    patch:
      operationId: updateGgsService
      tags: [ggs-admin]
      summary: Update a GGS service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsServiceInput"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsService"
        "404":
          description: Service not found
    delete:
      operationId: deleteGgsService
      tags: [ggs-admin]
      summary: Delete a GGS service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Service deleted
        "404":
          description: Service not found
  /ggs/admin/products:
    get:
      operationId: getGgsAdminProducts
      tags: [ggs-admin]
      summary: List all products in GGS CMS
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsProduct"
    post:
      operationId: createGgsProduct
      tags: [ggs-admin]
      summary: Create a GGS retail product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsProduct"
  /ggs/admin/products/{id}:
    patch:
      operationId: updateGgsProduct
      tags: [ggs-admin]
      summary: Update a GGS retail product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsProduct"
        "404":
          description: Product not found
    delete:
      operationId: deleteGgsProduct
      tags: [ggs-admin]
      summary: Delete a GGS retail product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /ggs/admin/vouchers:
    get:
      operationId: getGgsAdminVouchers
      tags: [ggs-admin]
      summary: List all vouchers in GGS CMS
      responses:
        "200":
          description: All vouchers, including drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsVoucher"
    post:
      operationId: createGgsVoucher
      tags: [ggs-admin]
      summary: Create a GGS voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsVoucherInput"
      responses:
        "201":
          description: Created voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsVoucher"
        "400":
          description: Invalid voucher details
        "409":
          description: Voucher code already exists
  /ggs/admin/vouchers/{id}:
    patch:
      operationId: updateGgsVoucher
      tags: [ggs-admin]
      summary: Update a GGS voucher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsVoucherInput"
      responses:
        "200":
          description: Updated voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsVoucher"
        "400":
          description: Invalid voucher details
        "404":
          description: Voucher not found
        "409":
          description: Voucher code already exists
    delete:
      operationId: deleteGgsVoucher
      tags: [ggs-admin]
      summary: Delete a GGS voucher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Voucher deleted
        "404":
          description: Voucher not found
  /ggs/admin/appointments:
    get:
      operationId: getGgsAdminAppointments
      tags: [ggs-admin]
      summary: List GGS appointment requests
      responses:
        "200":
          description: Appointment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GgsAppointment"
  /ggs/admin/appointments/{id}:
    patch:
      operationId: updateGgsAppointment
      tags: [ggs-admin]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GgsAppointmentStatusUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GgsAppointment"
        "404":
          description: Appointment not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GgsAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        identifierType:
          type: string
          enum: [email, whatsapp]
        identifier:
          type: string
        points:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - identifierType
        - identifier
        - points
        - createdAt
    GgsAccountRegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        identifierType:
          type: string
          enum: [email, whatsapp]
        identifier:
          type: string
          minLength: 6
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - identifierType
        - identifier
        - password
    GgsAccountLoginInput:
      type: object
      properties:
        identifierType:
          type: string
          enum: [email, whatsapp]
        identifier:
          type: string
          minLength: 6
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - identifierType
        - identifier
        - password
    GgsEmployeeAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
        name:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - employeeId
        - name
        - active
        - createdAt
    GgsEmployeeCashierRegister:
      type: string
      enum: [ggs_beauty, barber_ggs]
    GgsEmployeeCashierSession:
      type: object
      properties:
        active:
          type: boolean
        register:
          type: [string, "null"]
          enum: [ggs_beauty, barber_ggs, null]
        expiresAt:
          type: [string, "null"]
          format: date-time
      required:
        - active
        - register
        - expiresAt
    GgsEmployeeCashierAccessInput:
      type: object
      properties:
        register:
          $ref: "#/components/schemas/GgsEmployeeCashierRegister"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - register
        - password
    GgsEmployeeCashierAccess:
      type: object
      properties:
        register:
          $ref: "#/components/schemas/GgsEmployeeCashierRegister"
        expiresAt:
          type: string
          format: date-time
      required:
        - register
        - expiresAt
    GgsEmployeeLoginInput:
      type: object
      properties:
        employeeId:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - employeeId
        - password
    GgsEmployeeAccountInput:
      type: object
      properties:
        employeeId:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$"
        name:
          type: string
          minLength: 2
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - employeeId
        - name
        - password
    GgsEmployeeAccountUpdate:
      type: object
      minProperties: 1
      properties:
        employeeId:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$"
        name:
          type: string
          minLength: 2
          maxLength: 120
        active:
          type: boolean
        password:
          type: string
          minLength: 8
          maxLength: 128
    GgsEmployeeBooking:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        phone:
          type: string
        serviceName:
          type: string
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
      required:
        - id
        - customerName
        - phone
        - serviceName
        - appointmentDate
        - appointmentTime
        - notes
        - status
    GgsEmployeeAttendanceStatus:
      type: object
      properties:
        attendanceDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        status:
          type: string
          enum: [not_started, checked_in, checked_out]
        checkInAt:
          type: ["string", "null"]
          format: date-time
        checkOutAt:
          type: ["string", "null"]
          format: date-time
      required:
        - attendanceDate
        - status
        - checkInAt
        - checkOutAt
    GgsEmployeeAttendanceLocationInput:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
          maximum: 1000
      required: [latitude, longitude, accuracy]
    GgsEmployeeAttendanceChallenge:
      type: object
      properties:
        challengeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [challengeToken, expiresAt]
    GgsEmployeeAttendanceActionInput:
      type: object
      properties:
        challengeToken:
          type: string
          minLength: 32
          maxLength: 128
        latitude:
          type: number
